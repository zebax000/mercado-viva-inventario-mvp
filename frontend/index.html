<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado VIVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
    <div class="brand">
  <img src="img/logo-mercado-viva-clean.png" alt="Mercado VIVA" class="brand__logo">
    </div>

  <nav class="header-actions">
    <button id="btn-abrir-carrito" class="cart-trigger" aria-label="Abrir carrito">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M3 4h2l2.4 12.4A2 2 0 0 0 9.36 18H18a2 2 0 0 0 1.96-1.6L21.5 8H6.2"/>
        <circle cx="9.5" cy="21" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="18" cy="21" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
      <span id="contador-carrito" class="cart-count">0</span>
    </button>
    <button id="btn-cuenta" class="acceso-empleado" type="button" style="cursor:pointer; background:none; border:none;">Iniciar sesión</button>
    <a href="empleado.html" id="link-acceso-empleado" class="acceso-empleado" hidden>Acceso empleado</a>
  </nav>
</header>

<div class="buscador-bar">
  <input
    type="text"
    id="input-buscar"
    class="buscador-input"
    placeholder="Buscar por nombre o código de producto..."
  >
</div>

<main class="catalogo-wrap">
  <div id="catalogo-mensaje" class="catalogo-mensaje" hidden></div>
  <div id="grid-productos" class="grid-productos"></div>
</main>

<template id="tpl-tarjeta-producto">
  <article class="card-producto">
    <div class="card-producto__img-wrap">
      <img class="card-producto__img" src="" alt="">
      <span class="sello-agotado">Agotado</span>
    </div>
    <div class="card-producto__body">
      <p class="card-producto__nombre"></p>
      <div class="card-producto__linea-inferior">
        <span class="card-producto__precio"></span>
        <span class="card-producto__stock"></span>
      </div>
      <button class="btn-agregar" type="button">Agregar al carrito</button>
    </div>
  </article>
</template>

<div id="overlay" class="overlay" hidden></div>

<aside id="panel-carrito" class="panel-carrito" aria-hidden="true">
  <div class="panel-carrito__header">
    <h2>Tu carrito</h2>
    <button id="btn-cerrar-carrito" class="btn-cerrar" aria-label="Cerrar carrito">&times;</button>
  </div>

  <div id="carrito-vacio" class="carrito-vacio">
    <p>Tu carrito está vacío.</p>
  </div>

  <ul id="lista-carrito" class="lista-carrito"></ul>

  <div class="panel-carrito__footer">
    <div class="panel-carrito__total">
      <span>Total</span>
      <span id="carrito-total">$0</span>
    </div>
    <button id="btn-confirmar-compra" class="btn-confirmar" type="button">Confirmar compra</button>
    <p class="nota-simulada">Esta es una compra simulada — no se procesa ningún pago real.</p>
  </div>
</aside>

<template id="tpl-item-carrito">
  <li class="item-carrito">
    <img class="item-carrito__img" src="" alt="">
    <div class="item-carrito__info">
      <p class="item-carrito__nombre"></p>
      <span class="item-carrito__precio-unit"></span>
    </div>
    <div class="item-carrito__cantidad">
      <button class="btn-restar" type="button">−</button>
      <span class="item-carrito__cantidad-valor"></span>
      <button class="btn-sumar" type="button">+</button>
    </div>
    <button class="btn-quitar" type="button" aria-label="Quitar producto">&times;</button>
  </li>
</template>

<div id="modal-cuenta" class="modal-overlay" hidden>
  <div class="modal">
    <h3 id="titulo-modal-cuenta">Iniciar sesión</h3>

    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button id="tab-login" class="btn-primario" type="button">Iniciar sesión</button>
      <button id="tab-registro" class="btn-secundario" type="button">Crear cuenta</button>
    </div>

    <form id="form-cuenta">
      <div class="campo-form">
        <label for="input-usuario-cuenta">Usuario</label>
        <input type="text" id="input-usuario-cuenta" autocomplete="username" required>
      </div>
      <div class="campo-form">
        <label for="input-password-cuenta">Contraseña</label>
        <input type="password" id="input-password-cuenta" autocomplete="current-password" required>
      </div>

      <p id="error-modal-cuenta" class="mensaje-error-form"></p>

      <div class="modal-footer">
        <button type="button" id="btn-cancelar-cuenta" class="btn-secundario">Cancelar</button>
        <button type="submit" id="btn-enviar-cuenta" class="btn-primario">Iniciar sesión</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="script.js"></script>
<script src="cliente.js"></script>
</body>
</html>
