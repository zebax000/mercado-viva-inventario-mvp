<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado VIVA — Panel de empleado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <img src="img/logo-mercado-viva-clean.png" alt="Mercado VIVA" class="brand__logo">
  </div>
  <nav class="header-actions">
    <a href="index.html" class="acceso-empleado">Volver al catálogo</a>
  </nav>
</header>

<!-- ===== Puerta de acceso ===== -->
<section id="panel-acceso" class="panel-acceso">
  <h2>Acceso empleado</h2>
  <p>Ingresa el código de acceso para entrar al panel.</p>
  <input type="password" id="input-codigo-acceso" placeholder="Código de acceso">
  <button id="btn-entrar" class="btn-primario" type="button">Entrar</button>
  <p id="error-acceso" class="error-acceso"></p>
</section>

<!-- ===== Panel de empleado (oculto hasta validar el codigo) ===== -->
<main id="panel-empleado" class="empleado-wrap" hidden>
  <div class="empleado-toolbar">
    <h1>Inventario</h1>
    <button id="btn-nuevo-producto" class="btn-primario" type="button">+ Agregar producto</button>
  </div>

  <div id="empleado-mensaje" class="catalogo-mensaje" hidden></div>

  <table class="tabla-productos">
    <thead>
      <tr>
        <th></th>
        <th>Código</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-productos-body"></tbody>
  </table>
</main>

<!-- ===== Modal: crear / editar producto ===== -->
<div id="modal-producto" class="modal-overlay" hidden>
  <div class="modal">
    <h3 id="modal-producto-titulo">Agregar producto</h3>
    <p id="modal-producto-error" class="mensaje-error-form"></p>

    <div class="campo-form">
      <label for="form-codigo">Código</label>
      <input type="text" id="form-codigo">
    </div>
    <div class="campo-form">
      <label for="form-nombre">Nombre</label>
      <input type="text" id="form-nombre">
    </div>
    <div class="campo-form">
      <label for="form-stock">Stock inicial</label>
      <input type="number" id="form-stock" min="0" step="1">
    </div>
    <div class="campo-form">
      <label for="form-precio">Precio</label>
      <input type="number" id="form-precio" min="0" step="1">
    </div>
    <div class="campo-form">
      <label for="form-imagen">URL de la imagen (raw de GitHub)</label>
      <input type="text" id="form-imagen" placeholder="https://raw.githubusercontent.com/...">
    </div>
    <div class="campo-form">
      <label for="form-categoria">Categoría</label>
      <select id="form-categoria">
        <option value="">Selecciona una categoría</option>
        <option value="Frutas y Verduras">Frutas y Verduras</option>
        <option value="Carnes">Carnes</option>
        <option value="Lácteos">Lácteos</option>
        <option value="Despensa">Despensa</option>
        <option value="Bebidas">Bebidas</option>
        <option value="Panadería">Panadería</option>
        <option value="Congelados">Congelados</option>
        <option value="Aseo y Limpieza">Aseo y Limpieza</option>
        <option value="Cuidado Personal">Cuidado Personal</option>
        <option value="Otros">Otros</option>
      </select>
    </div>
    <div class="campo-form">
      <label for="form-subcategoria">Subcategoría</label>
      <select id="form-subcategoria">
        <option value="">Selecciona primero una categoría</option>
      </select>
    </div>
    <div class="campo-form">
      <label for="form-descuento">% de descuento</label>
      <input type="number" id="form-descuento" min="0" max="100" step="1">
    </div>
    <div class="campo-form">
      <label>Días de descuento</label>
      <div id="grupo-dias-descuento" style="display:flex; flex-wrap:wrap; gap:8px 14px;">
        <label style="font-size:13px; display:flex; align-items:center; gap:5px; color: var(--texto); font-weight:400;"><input type="checkbox" value="lunes"> Lunes</label>
        <label style="font-size:13px; display:flex; align-items:center; gap:5px; color: var(--texto); font-weight:400;"><input type="checkbox" value="martes"> Martes</label>
        <label style="font-size:13px; display:flex; align-items:center; gap:5px; color: var(--texto); font-weight:400;"><input type="checkbox" value="miercoles"> Miércoles</label>
        <label style="font-size:13px; display:flex; align-items:center; gap:5px; color: var(--texto); font-weight:400;"><input type="checkbox" value="jueves"> Jueves</label>
        <label style="font-size:13px; display:flex; align-items:center; gap:5px; color: var(--texto); font-weight:400;"><input type="checkbox" value="viernes"> Viernes</label>
        <label style="font-size:13px; display:flex; align-items:center; gap:5px; color: var(--texto); font-weight:400;"><input type="checkbox" value="sabado"> Sábado</label>
        <label style="font-size:13px; display:flex; align-items:center; gap:5px; color: var(--texto); font-weight:400;"><input type="checkbox" value="domingo"> Domingo</label>
      </div>
    </div>

    <div class="modal-footer">
      <button id="btn-cancelar-producto" class="btn-secundario" type="button">Cancelar</button>
      <button id="btn-guardar-producto" class="btn-primario" type="button">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== Modal: reponer stock ===== -->
<div id="modal-reponer" class="modal-overlay" hidden>
  <div class="modal">
    <h3>Reponer stock</h3>
    <p id="reponer-nombre" style="font-size:13.5px; color: var(--texto-suave); margin-bottom: 14px;"></p>
    <p id="modal-reponer-error" class="mensaje-error-form"></p>
    <div class="campo-form">
      <label for="form-cantidad-reponer">Cantidad a agregar</label>
      <input type="number" id="form-cantidad-reponer" min="1" step="1">
    </div>
    <div class="modal-footer">
      <button id="btn-cancelar-reponer" class="btn-secundario" type="button">Cancelar</button>
      <button id="btn-confirmar-reponer" class="btn-primario" type="button">Reponer</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="script.js"></script>
<script src="empleado.js"></script>
</body>
</html>
